[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "web-scraping-zero-to-practical"
version = "0.1.0"
description = "Thai learning repository for safe, maintainable Python web scraping"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "web-scraping-zero-to-practical contributors" },
]
dependencies = [
    "requests>=2.31,<3",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5,<7",
    "pandas>=2.1,<4",
    "openpyxl>=3.1,<4",
    "python-dotenv>=1.0,<2",
    "tenacity>=8.2,<10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<9",
    "responses>=0.24,<1",
    "ruff>=0.6,<1",
    "mypy>=1.8,<2",
    "pre-commit>=3.6,<5",
]
browser = [
    "playwright>=1.40,<2",
    "selenium>=4.15,<5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true
